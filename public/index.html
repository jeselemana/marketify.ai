<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fb" />
    <meta
      name="description"
      content="Marketify AI biznes məqsədini strukturlaşdırılmış, icra oluna bilən strategiyaya çevirir."
    />
    <title>Marketify AI — Strategiya workspace-i</title>
    <link rel="icon" href="/MarketifyAINewFavicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <script src="/script.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">Əsas hissəyə keç</a>

    <div class="app-shell">
      <nav class="navigation-rail" aria-label="Sürətli naviqasiya">
        <button class="rail-button rail-menu" id="railMenuButton" type="button" aria-label="Workspace menyusunu aç" aria-expanded="false" data-tooltip="Menyu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <div class="rail-nav">
          <button class="rail-button is-active" id="railHomeButton" type="button" aria-label="Başlanğıc" data-tooltip="Başlanğıc">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6Z" /><path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z" /></svg>
          </button>
          <button class="rail-button" id="railStrategiesButton" type="button" aria-label="Strategiyalar" data-tooltip="Strategiyalar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5h7l2 2h9v9.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" /><path d="M3 7.5V5a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v2.5" /></svg>
          </button>
        </div>
        <button class="rail-button rail-new" id="railNewButton" type="button" aria-label="Yeni strategiya" data-tooltip="Yeni strategiya">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </nav>

      <aside class="sidebar" id="sidebar" aria-label="Əsas naviqasiya">
        <div class="sidebar-top">
          <a class="brand" href="/" aria-label="Marketify AI ana səhifə">
            <strong class="brand-wordmark">Marketify AI</strong>
          </a>
          <button class="icon-button sidebar-close" id="sidebarClose" type="button" aria-label="Menyunu bağla">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <button class="new-strategy-button" id="newStrategyButton" type="button">
          <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z" />
          </svg>
          Yeni strategiya
        </button>

        <nav class="primary-nav" aria-label="Workspace">
          <button class="nav-item is-active" id="homeNav" type="button">
            <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 3 1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6Z" />
              <path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z" />
            </svg>
            Başlanğıc
          </button>
          <button class="nav-item" id="strategiesNav" type="button">
            <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7.5h7l2 2h9v9.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
              <path d="M3 7.5V5a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v2.5" />
            </svg>
            Strategiyalar
            <span class="nav-count" id="strategyCount">0</span>
          </button>
        </nav>

        <div class="recent-section">
          <div class="sidebar-label">Son işlər</div>
          <div class="recent-list" id="recentList">
            <div class="recent-empty"><strong>Strategiyalar burada görünəcək.</strong><span>Yadda saxladığın işlər bu bölmədə qalır.</span></div>
          </div>
        </div>

        <div class="sidebar-footer">
          <div class="workspace-avatar" aria-hidden="true">M</div>
          <div>
            <strong>Marketify workspace</strong>
            <span>Şəxsi · bu cihazda</span>
          </div>
        </div>
      </aside>

      <div class="mobile-overlay" id="mobileOverlay" hidden></div>

      <div class="app-main">
        <header class="mobile-header">
          <button class="icon-button" id="mobileMenuButton" type="button" aria-label="Menyunu aç" aria-expanded="false">
            <span aria-hidden="true">☰</span>
          </button>
          <a class="mobile-brand" href="/">
            <span class="brand-mark" aria-hidden="true">M</span>
            <strong>Marketify</strong>
          </a>
          <button class="mobile-new" id="mobileNewButton" type="button" aria-label="Yeni strategiya">＋</button>
        </header>

        <header class="mode-header" aria-label="Marketify rejimi">
          <div class="mode-switch" role="tablist" aria-label="İş rejimi">
            <button class="mode-option is-active" id="buildModeButton" type="button" role="tab" aria-selected="true">Build</button>
            <button class="mode-option" id="askModeButton" type="button" role="tab" aria-selected="false">Ask</button>
          </div>
        </header>

        <main id="workspace" class="workspace" tabindex="-1">
          <div class="initial-loader" aria-live="polite">Workspace hazırlanır…</div>
        </main>
      </div>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
