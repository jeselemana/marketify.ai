<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fb" />
    <meta
      name="description"
      content="Marketify AI biznes məqsədini strukturlaşdırılmış, icra oluna bilən strategiyaya çevirir."
    />
    <title>Marketify AI — Strategiya workspace-i</title>
    <link rel="icon" href="/MarketifyAINewFavicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
<link rel="stylesheet" href="/style.css?v=3.8" />

<script
  src="https://accounts.google.com/gsi/client"
  async
  defer
></script>

<script src="/script.js?v=3.8" type="module"></script>
  </head>
  <body class="auth-loading">
    <a class="skip-link" href="#workspace">Əsas hissəyə keç</a>

    <main class="auth-root" id="authRoot" aria-live="polite">
      <div class="auth-boot"><span class="auth-boot-mark">M</span><span>Marketify açılır…</span></div>
    </main>

    <div class="app-shell" id="appShell" hidden>
      <nav class="navigation-rail" aria-label="Sürətli naviqasiya">
        <button class="rail-button rail-menu" id="railMenuButton" type="button" aria-label="Workspace menyusunu aç" aria-expanded="false" data-tooltip="Menyu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
        <div class="rail-nav">
          <button class="rail-button rail-mode-toggle" id="railModeToggleButton" type="button" aria-label="Ask rejiminə keç" data-tooltip="Rejim: Build (Ask-a keç)">
            <span class="rail-toggle-track" aria-hidden="true">
              <span class="rail-toggle-thumb"></span>
            </span>
          </button>
          <button class="rail-button is-active" id="railHomeButton" type="button" aria-label="Başlanğıc" data-tooltip="Başlanğıc">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </button>
          <button class="rail-button" id="railStrategiesButton" type="button" aria-label="Arxiv" data-tooltip="Arxiv">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 8 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          </button>
          <button class="rail-button" id="railPlannerButton" type="button" aria-label="Planlaşdırılanlar" data-tooltip="Planlaşdırılanlar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          </button>
          <button class="rail-button" id="railLimitsButton" type="button" aria-label="İstifadə limiti" data-tooltip="İstifadə limiti">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3.34 17a10 10 0 1 1 17.32 0"/>
              <path d="m12 14 4-4"/>
              <circle cx="12" cy="14" r="2"/>
            </svg>
          </button>
        </div>
      </nav>

      <aside class="sidebar" id="sidebar" aria-label="Əsas naviqasiya">
        <div class="sidebar-top">
          <a class="brand" href="/" aria-label="Marketify AI ana səhifə">
            <strong class="brand-wordmark">Marketify AI</strong>
          </a>
          <button class="icon-button sidebar-close" id="sidebarClose" type="button" aria-label="Menyunu bağla">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="sidebar-mode-switch" role="tablist" aria-label="İş rejimi">
          <button class="sidebar-mode-option is-active" id="sidebarBuildModeButton" type="button" role="tab" aria-selected="true">Build</button>
          <button class="sidebar-mode-option" id="sidebarAskModeButton" type="button" role="tab" aria-selected="false">Ask</button>
        </div>

        <button class="new-strategy-button" id="newStrategyButton" type="button">
          <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>Yeni strategiya</span>
        </button>

        <nav class="primary-nav" aria-label="Workspace">
          <button class="nav-item is-active" id="homeNav" type="button">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            <span>Başlanğıc</span>
          </button>
          <button class="nav-item" id="strategiesNav" type="button">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 8 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
            </svg>
            <span>Arxiv</span>
            <span class="nav-count" id="strategyCount">0</span>
          </button>
          <button class="nav-item" id="plannerNav" type="button">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
            <span>Planlaşdırılanlar</span>
            <span class="nav-count" id="plannerCount">0</span>
          </button>
          <button class="nav-item" id="limitsNav" type="button">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3.34 17a10 10 0 1 1 17.32 0"/>
              <path d="m12 14 4-4"/>
              <circle cx="12" cy="14" r="2"/>
            </svg>
            <span>İstifadə limiti</span>
          </button>
          <button class="nav-item" id="settingsNav" type="button">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
            <span>Parametrlər</span>
          </button>
        </nav>

        <div class="recent-section">
          <div class="sidebar-label">Son işlər</div>
          <div class="recent-list" id="recentList">
            <div class="recent-empty"><strong>Strategiyalar burada görünəcək.</strong><span>Yadda saxladığın işlər bu bölmədə qalır.</span></div>
          </div>
        </div>

        <button class="sidebar-footer" id="accountButton" type="button">
          <div class="workspace-avatar" id="workspaceAvatar" aria-hidden="true">M</div>
          <div class="sidebar-footer-text">
            <strong id="workspaceName">Marketify workspace</strong>
            <span id="workspaceMeta">Şəxsi hesab</span>
          </div>
          <svg class="account-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <div class="sidebar-legal">
          <button class="sidebar-legal-link" id="sidebarTermsBtn" type="button">İstifadə şərtləri</button>
          <span class="sidebar-legal-dot">•</span>
          <button class="sidebar-legal-link" id="sidebarPrivacyBtn" type="button">Məxfilik siyasəti</button>
        </div>
      </aside>

      <div class="mobile-overlay" id="mobileOverlay" hidden></div>
      <div class="legal-modal-overlay" id="legalModalOverlay" hidden></div>

      <div class="app-main">
        <header class="mobile-header">
          <button class="icon-button" id="mobileMenuButton" type="button" aria-label="Menyunu aç" aria-expanded="false">
            <span aria-hidden="true">☰</span>
          </button>
          <div class="mobile-mode-switch" role="tablist" aria-label="İş rejimi">
            <button class="mobile-mode-option is-active" id="buildModeButton" type="button" role="tab" aria-selected="true">Build</button>
            <button class="mobile-mode-option" id="askModeButton" type="button" role="tab" aria-selected="false">Ask</button>
          </div>
          <button class="mobile-new" id="mobileNewButton" type="button" aria-label="Yeni strategiya">＋</button>
        </header>

        <main id="workspace" class="workspace" tabindex="-1">
          <div class="initial-loader" aria-live="polite">Workspace hazırlanır…</div>
        </main>
      </div>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
